plugins {
    id 'base'
}

subprojects {
    group = 'de.jeff_media'
    version = properties['mod_version'] ?: '2.2.0'

    repositories {
        mavenCentral()
    }
    
    // Common settings
    tasks.withType(JavaCompile).configureEach {
        options.release.set(21)
        options.encoding = 'UTF-8'
    }

}

tasks.register('copyArtifacts', Copy) {
    dependsOn subprojects.collect { it.path + ':build' }
    
    doFirst {
        delete layout.buildDirectory.dir('libs')
    }

    from project(':paper').layout.buildDirectory.dir('libs')
    from project(':fabric').layout.buildDirectory.dir('libs')
    include "*-Paper.jar"
    include "*-Fabric.jar"
    into layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

build.finalizedBy(copyArtifacts)
